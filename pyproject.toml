[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-model-calibration-uq"
version = "0.2.0"
description = "Simulation calibration, UQ, stochastic kriging, OCBA, and noisy simulation optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Jors Academy"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
