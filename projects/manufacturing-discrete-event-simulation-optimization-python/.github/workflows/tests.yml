name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DES self-test
        run: python manufacturing_des_optimization.py --self-test

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Run short simulation-optimization smoke test
        run: |
          python manufacturing_des_optimization.py \
            --selection-replications 4 \
            --validation-replications 6 \
            --seed 42
