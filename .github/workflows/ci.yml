name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest

  research-smoke:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run synthetic calibration and UQ study
        run: >-
          python scripts/run_study.py
          --seed 42 --horizon 280
          --observed-reps 14 --calibration-reps 6
          --bootstrap 10 --sobol-base 32
          --output artifacts/study.json
      - uses: actions/upload-artifact@v6
        with:
          name: simulation-calibration-uq-smoke
          path: artifacts/*.json
